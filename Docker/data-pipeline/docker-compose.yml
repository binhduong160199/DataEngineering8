version: "3.8"

services:
  spark-master:
    image: spark:3.5.7-scala2.12-java17-python3-ubuntu
    container_name: spark-master
    environment:

      - SPARK_NO_DAEMONIZE=true         # keep process in foreground
      - SPARK_PUBLIC_DNS=localhost      # optional: nicer UI links
    user: root
    command: >
        /bin/bash -c "apt-get update && pip install --upgrade pip && pip install psycopg2-binary && /opt/spark/sbin/start-master.sh"

    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
          - .:/app
    networks: [spark-net]

  spark-worker-1:
    image: spark:3.5.7-scala2.12-java17-python3-ubuntu
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
    user: root
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    ports:
      - "8081:8081"
    volumes:
      - .:/app
    networks: [spark-net]

  db:
    image: postgres:16
    container_name: nyc_tlc_postgres16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=group8
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    networks: [spark-net]

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: streamlit-dashboard
    depends_on:
      - db
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    networks: [spark-net]

volumes:
  pgdata:

networks:
  spark-net:
    driver: bridge
